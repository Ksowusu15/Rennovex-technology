name: Release checks

on:
  push:
    branches: [release/readiness-fixes]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: rennovex_release_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/rennovex_release_test?sslmode=disable
      DIRECT_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/rennovex_release_test?sslmode=disable
      TEST_DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/rennovex_release_test?sslmode=disable
      ALLOW_LOCAL_RELEASE_TESTS: '1'
      AUTH_SECRET: isolated-ci-only-secret-012345678901234567890
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:deploy
      - run: npm run typecheck
      - run: npm run test:forms
      - run: npm run test:security
      - run: npm run test:notifications
      - run: npm run test:readiness
      - run: npm run test:database
      - run: npm run migrations:preflight
      - run: npm run db:verify
      - run: npm run db:status
      - run: npm audit --omit=dev
      - run: npm run build
